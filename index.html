
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polluted Hub Key</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap');

:root {
  --bg: #080910;
  --purple: #a855f7;
  --cyan: #38f9d7;
  --text: #f6f4ff;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  overflow-x: hidden;
  color: var(--text);
  font-family: 'Inter', sans-serif;
  background:
    radial-gradient(ellipse at 15% 15%, #6122a52e, transparent 45%),
    radial-gradient(ellipse at 85% 85%, #00e5c425, transparent 40%),
    var(--bg);
}

#particles {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 0;
}

.orb {
  position: fixed;
  width: 240px;
  height: 240px;
  border-radius: 50%;
  filter: blur(100px);
  opacity: .22;
  pointer-events: none;
  animation: float 8s ease-in-out infinite alternate;
}

.orb.one {
  background: #a855f7;
  top: 5%;
  left: -100px;
}

.orb.two {
  background: #00ffd0;
  right: -100px;
  bottom: 5%;
  animation-delay: -4s;
}

.container {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 480px;
  animation: appear .8s ease both;
}

.top-label {
  text-align: center;
  margin-bottom: 24px;
}

.status {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  border: 1px solid #38f9d747;
  border-radius: 30px;
  padding: 8px 13px;
  color: var(--cyan);
  background: #38f9d70b;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 2px;
}

.dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--cyan);
  box-shadow: 0 0 12px var(--cyan);
  animation: pulse 1.5s infinite;
}

.card {
  position: relative;
  overflow: hidden;
  padding: 35px 27px 27px;
  border: 1px solid #a855f746;
  border-radius: 25px;
  background: linear-gradient(145deg, #171522f5, #0d111bf5);
  box-shadow:
    0 0 60px #a855f714,
    inset 0 1px 0 #ffffff12;
}

.card::before {
  content: "";
  position: absolute;
  top: 0;
  left: 15%;
  width: 70%;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--purple), var(--cyan), transparent);
  box-shadow: 0 0 20px var(--purple);
}

.logo {
  width: 78px;
  height: 78px;
  margin: 0 auto 20px;
  display: grid;
  place-items: center;
  border-radius: 23px;
  border: 1px solid #a855f775;
  background: linear-gradient(145deg, #a855f729, #38f9d70b);
  box-shadow: 0 0 35px #a855f725;
  font-family: 'Orbitron', sans-serif;
  font-size: 34px;
  font-weight: 800;
  color: white;
  text-shadow: 0 0 20px var(--purple);
  transform: rotate(-5deg);
  animation: logoGlow 3s ease-in-out infinite;
}

h1 {
  font-family: 'Orbitron', sans-serif;
  text-align: center;
  font-size: clamp(24px, 6vw, 31px);
  font-weight: 800;
  letter-spacing: -1px;
  background: linear-gradient(100deg, #fff 15%, #c084fc 55%, #38f9d7);
  background-clip: text;
  -webkit-background-clip: text;
  color: transparent;
}

.subtitle {
  margin-top: 12px;
  text-align: center;
  color: #9997ad;
  font-size: 13px;
  line-height: 1.7;
}

.divider {
  height: 1px;
  margin: 26px 0;
  background: linear-gradient(90deg, transparent, #a855f74a, transparent);
}

.label-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-bottom: 12px;
}

.label {
  color: #c9c5db;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 1px;
}

.secure {
  color: var(--cyan);
  font-size: 10px;
}

.key-box {
  padding: 17px 14px;
  border: 1px solid #a855f74a;
  border-radius: 13px;
  background: #080910b8;
  word-break: break-word;
  text-align: center;
  color: #f0e4ff;
  font-size: 14px;
  font-weight: 600;
  line-height: 1.8;
  box-shadow: inset 0 0 20px #a855f709;
  user-select: all;
}

.actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 11px;
  margin-top: 15px;
}

button {
  min-height: 47px;
  border-radius: 11px;
  font-family: 'Inter', sans-serif;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  transition: transform .2s, box-shadow .2s, border-color .2s;
}

button:hover {
  transform: translateY(-3px);
}

button:active {
  transform: scale(.97);
}

.copy-btn {
  border: none;
  color: #090910;
  background: linear-gradient(100deg, #c084fc, #38f9d7);
  box-shadow: 0 5px 22px #a855f725;
}

.copy-btn:hover {
  box-shadow: 0 8px 28px #38f9d740;
}

.save-btn {
  color: #e7ddff;
  background: #ffffff06;
  border: 1px solid #a855f74a;
}

.save-btn:hover {
  border-color: var(--purple);
}

.saved-info {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  margin-top: 17px;
  color: #9290a7;
  font-size: 11px;
}

.saved-info span {
  color: var(--cyan);
}

.footer {
  margin-top: 22px;
  text-align: center;
  color: #66657b;
  font-size: 10px;
  letter-spacing: 1px;
}

.footer strong {
  color: #b98aff;
}

.toast {
  position: fixed;
  z-index: 5;
  bottom: 28px;
  left: 50%;
  width: max-content;
  max-width: calc(100% - 32px);
  transform: translate(-50%, 20px);
  opacity: 0;
  pointer-events: none;
  padding: 13px 18px;
  border: 1px solid #38f9d75a;
  border-radius: 12px;
  color: var(--cyan);
  background: #11141df5;
  font-size: 13px;
  transition: .3s ease;
}

.toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
}

@keyframes appear {
  from { opacity: 0; transform: translateY(25px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes pulse {
  50% { opacity: .4; }
}

@keyframes float {
  to { transform: translate(35px, -30px) scale(1.2); }
}

@keyframes logoGlow {
  50% { box-shadow: 0 0 42px #a855f755; }
}

@media (max-width: 400px) {
  .card { padding: 28px 19px 23px; }
  .key-box { font-size: 12px; }
  .actions { gap: 8px; }
  button { font-size: 11px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation: none !important;
    transition: none !important;
  }
}
</style>
</head>

<body>
<canvas id="particles"></canvas>
<div class="orb one"></div>
<div class="orb two"></div>

<main class="container">
  <div class="top-label">
    <div class="status">
      <span class="dot"></span>
      POLLUTED HUB SYSTEM
    </div>
  </div>

  <section class="card">
    <div class="logo">P</div>

    <h1>Polluted Hub Key</h1>
    <p class="subtitle">
      Your key is ready.<br>
      Copy and save it for later use.
    </p>

    <div class="divider"></div>

    <div class="label-row">
      <span class="label">YOUR ACCESS KEY</span>
      <span class="secure">● KEY READY</span>
    </div>

    <div class="key-box" id="keyValue">PollutedHubKeyHakwoowo - Nalapqpiwjebejejelwp</div>

    <div class="actions">
      <button class="copy-btn" id="copyBtn" onclick="copyKey()">
        ↗ &nbsp; COPY KEY
      </button>

      <button class="save-btn" id="saveBtn" onclick="saveKey()">
        ♧ &nbsp; SAVE KEY
      </button>
    </div>

    <div class="saved-info">
      <span>●</span>
      <span id="saveStatus" style="color:inherit">Key is ready to use</span>
    </div>
  </section>

  <footer class="footer">
    POWERED BY <strong>POLLUTED HUB</strong>
  </footer>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const KEY = "PollutedHubKeyHakwoowo - Nalapqpiwjebejejelwp";

function showToast(message) {
  const toast = document.getElementById("toast");
  toast.textContent = message;
  toast.classList.add("show");

  clearTimeout(window.toastTimer);
  window.toastTimer = setTimeout(() => {
    toast.classList.remove("show");
  }, 2400);
}

async function copyKey() {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(KEY);
    } else {
      const textarea = document.createElement("textarea");
      textarea.value = KEY;
      textarea.style.position = "fixed";
      textarea.style.opacity = "0";
      document.body.appendChild(textarea);
      textarea.select();

      const success = document.execCommand("copy");
      textarea.remove();

      if (!success) throw new Error("Copy failed");
    }

    document.getElementById("copyBtn").textContent = "✓  COPIED!";
    showToast("✓ Key copied successfully!");

    setTimeout(() => {
      document.getElementById("copyBtn").innerHTML =
        "↗ &nbsp; COPY KEY";
    }, 1800);
  } catch (error) {
    showToast("Please select and copy the key manually.");
  }
}

function saveKey() {
  try {
    localStorage.setItem("pollutedHubSavedKey", KEY);

    document.getElementById("saveStatus").textContent =
      "Key saved on this browser";

    document.getElementById("saveBtn").textContent = "✓  SAVED";
    showToast("✓ Key saved successfully!");

    setTimeout(() => {
      document.getElementById("saveBtn").innerHTML =
        "♧ &nbsp; SAVE KEY";
    }, 1800);
  } catch (error) {
    showToast("Unable to save key in this browser.");
  }
}

try {
  if (localStorage.getItem("pollutedHubSavedKey") === KEY) {
    document.getElementById("saveStatus").textContent =
      "Key saved on this browser";
  }
} catch (error) {
  // The page remains usable if browser storage is disabled.
}

// Floating neon particles
const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");
let particles = [];

function resizeCanvas() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = innerWidth * dpr;
  canvas.height = innerHeight * dpr;
  canvas.style.width = innerWidth + "px";
  canvas.style.height = innerHeight + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  particles = Array.from(
    { length: Math.min(65, Math.floor(innerWidth / 10)) },
    () => ({
      x: Math.random() * innerWidth,
      y: Math.random() * innerHeight,
      r: Math.random() * 1.8 + .5,
      speed: Math.random() * .45 + .15,
      alpha: Math.random() * .5 + .15,
      drift: (Math.random() - .5) * .3
    })
  );
}

function animateParticles() {
  ctx.clearRect(0, 0, innerWidth, innerHeight);

  for (const p of particles) {
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(168,85,247,${p.alpha})`;
    ctx.fill();

    p.y -= p.speed;
    p.x += p.drift;

    if (p.y < -5) {
      p.y = innerHeight + 5;
      p.x = Math.random() * innerWidth;
    }

    if (p.x < 0) p.x = innerWidth;
    if (p.x > innerWidth) p.x = 0;
  }

  requestAnimationFrame(animateParticles);
}

window.addEventListener("resize", resizeCanvas);
resizeCanvas();
animateParticles();
</script>
</body>
</html>
